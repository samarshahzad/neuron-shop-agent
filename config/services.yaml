services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    # The AI provider is configured entirely through .env / .env.local
    App\Neuron\AiProviderFactory:
        arguments:
            $provider: '%env(AI_PROVIDER)%'
            $model: '%env(AI_MODEL)%'
            $apiKey: '%env(AI_API_KEY)%'
            $ollamaUrl: '%env(OLLAMA_URL)%'

    # Embeddings model for "similar products" (AI similarity), also from .env
    App\Recommendation\EmbeddingsProviderFactory:
        arguments:
            $provider: '%env(EMBEDDINGS_PROVIDER)%'
            $model: '%env(EMBEDDINGS_MODEL)%'
            $apiKey: '%env(AI_API_KEY)%'
            $ollamaUrl: '%env(OLLAMA_URL)%'
